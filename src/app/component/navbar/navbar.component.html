<header>
  <mat-toolbar class="navbar">
    <a routerLink="" class="logo-link"><img class="blogo" [src]="logo" alt="Codehelio home"></a>
    <span class="spacer"></span>
    <h1 class="title">BIT GPA Calculator</h1>
    <span class="spacer"></span>
    <nav class="nav" aria-label="Main">
      <ul class="navlist">
        <li><a routerLink="">Home</a></li>
        <li><a routerLink="contactus">Contact us</a></li>
        <li><a routerLink="about">About</a></li>
      </ul>
    </nav>

    <div class="menu">
      <button mat-icon-button type="button" class="menubtn" (click)="openNav()" aria-label="Open menu"
              aria-controls="mySidenav" [attr.aria-expanded]="navOpen">
        <mat-icon>menu</mat-icon>
      </button>
      <nav id="mySidenav" class="sidenav" [class.open]="navOpen" [attr.aria-hidden]="!navOpen" [attr.inert]="navOpen ? null : ''"
           aria-label="Main">
        <button type="button" class="closebtn" (click)="closeNav()" aria-label="Close menu">&times;</button>
        <a routerLink="../" (click)="closeNav()">Home</a>
        <a routerLink="contactus" (click)="closeNav()">Contact us</a>
        <a routerLink="about" (click)="closeNav()">About</a>
      </nav>
    </div>

  </mat-toolbar>
</header>
